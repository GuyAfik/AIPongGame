[project]
name = "ai-pong-game"
version = "0.1.0"
description = "Pong game with a locally-trained DQN AI opponent"
requires-python = ">=3.13"
dependencies = [
    "pygame>=2.6",
    "torch>=2.6",
    "numpy>=2.2",
    "matplotlib>=3.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
